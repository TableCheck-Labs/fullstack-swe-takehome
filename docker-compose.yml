version: "3.9"

# cd ssr
# npm run dev:ssr
services:
  ssr:
    build:
      context: ./ssr
    expose:
      - "7456"
    depends_on:
      - api
      - redis
    environment:
      - NODE_ENV=production

  # cd api
  # npm start
  api:
    image: node:19-alpine
    ports:
      - 9001:9001
    volumes:
      - ./api:/app
    working_dir: /app
    command: npm run start

  # will be skipped if RATE_LIMIT is not set in ssr service
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  varnish:
    image: varnish:stable
    ports:
      - "8080:80"
    volumes:
      - ./default.vcl:/etc/varnish/default.vcl
    depends_on:
      - ssr
    environment:
      - VARNISH_SIZE=100M

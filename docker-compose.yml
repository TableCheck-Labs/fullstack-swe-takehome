services:
  ssr:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    volumes:
      - ./ssr:/app
    working_dir: /app
    command: npm run dev
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3001:3001
    volumes:
      - ./api:/app
    working_dir: /app
    command: npm run dev
  redis:
    image: redis:latest
    ports:
      - 6379:6379
    volumes:
      - ./redis:/data
    working_dir: /data
    command: redis-server --appendonly yes
